<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <meta
      name="description"
      content="NEXUS — Local-first AI studio powered by Puter.js. Chat, image, video & voice with 500+ models. No accounts, everything saved locally."
    />
    <title>NEXUS — Local AI Studio · Puter.js</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script src="https://js.puter.com/v2/"></script>

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2309090b'/%3E%3Cpath d='M10.5 10.5l11 11M21.5 10.5l-11 11' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='white'/%3E%3C/svg%3E"
    />
    <style>
      /* Painted before the bundle boots so there is never a white flash. */
      html { background: #000; }
      html.light { background: #fff; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        transition: opacity .35s ease;
      }
      html.light #boot { background: #fff; color: #09090b; }
      #boot .mark {
        width: 34px; height: 34px; border-radius: 10px;
        border: 1.5px solid currentColor; opacity: .9;
        animation: boot-pulse 1.25s cubic-bezier(.4,0,.2,1) infinite;
      }
      @keyframes boot-pulse {
        0%,100% { transform: scale(.86); opacity: .35; }
        50%     { transform: scale(1);   opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { #boot .mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="mark"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
